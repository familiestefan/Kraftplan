<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibler Intervall & Workout Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS CDN für Excel & CSV Upload -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-stopwatch text-indigo-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">FlexiTimer Pro</h1>
        </div>
        <button id="toggle-sound-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm flex items-center gap-2 transition">
            <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-400"></i>
            <span id="sound-text">Ton An</span>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4 flex flex-col justify-center">

        <!-- VIEW 1: PRESET & WORKOUT BUILDER -->
        <div id="view-setup" class="space-y-6">

            <!-- Presets & File Import -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Trainingsplan auswählen</label>
                <div class="flex gap-2">
                    <select id="routine-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="preset-athletik">Athletik Kreis (Aus Vorlage)</option>
                        <option value="preset-tabata">Klassisches Tabata (4 Min)</option>
                        <option value="custom">-- Eigener Plan / Importiert --</option>
                    </select>
                </div>

                <!-- Text & Excel File Import Section -->
                <div class="mt-4 pt-3 border-t border-slate-800">
                    <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">
                        <i class="fa-solid fa-file-arrow-up mr-1"></i> Datei einlesen (.txt, .xlsx, .xls, .csv)
                    </label>
                    <label class="flex items-center justify-center w-full p-3 bg-slate-950 border border-dashed border-indigo-800/80 hover:border-indigo-500 rounded-xl cursor-pointer transition text-xs text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-file-lines mr-2 text-indigo-400 text-sm"></i>
                        <span id="file-label">Datei auswählen (.txt, .xlsx, .csv)</span>
                        <input type="file" id="document-file-input" accept=".txt, .xlsx, .xls, .csv" class="hidden">
                    </label>
                    <div id="status-message" class="hidden mt-2 p-2.5 rounded-xl text-xs text-center font-medium"></div>
                </div>

                <!-- Export & Import Buttons for JSON Plans -->
                <div class="mt-4 pt-3 border-t border-slate-800 flex gap-2">
                    <button id="export-json-btn" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-download text-indigo-400"></i> Plan Exportieren (JSON)
                    </button>
                    <label class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5 cursor-pointer text-center">
                        <i class="fa-solid fa-upload text-indigo-400"></i> Plan Importieren
                        <input type="file" id="import-json-file" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Global Settings (Default Pause & Rounds) -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Workout Einstellungen</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Standard Pause (Sek)</label>
                        <input type="number" id="default-rest" value="30" min="0" max="300" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-amber-400 font-bold focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Zirkel-Runden gesamt</label>
                        <input type="number" id="total-rounds" value="1" min="1" max="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-indigo-400 font-bold focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Exercises List -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Übungen im Zirkel</h2>
                    <span id="exercise-count" class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full">0 Übungen</span>
                </div>

                <div id="exercise-list" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    <!-- Dynamic exercise cards generated here -->
                </div>

                <button id="add-exercise-btn" class="w-full py-2.5 border-2 border-dashed border-slate-700 hover:border-slate-500 text-slate-400 hover:text-slate-200 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Übung hinzufügen
                </button>
            </div>

            <!-- Start Button -->
            <button id="start-workout-btn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-lg rounded-2xl shadow-lg shadow-emerald-950/50 uppercase tracking-wider transition transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Workout Starten
            </button>
        </div>

        <!-- VIEW 2: ACTIVE TIMER RUNNING -->
        <div id="view-timer" class="hidden flex flex-col items-center justify-center text-center space-y-6">

            <!-- Round & Status Header -->
            <div class="space-y-1">
                <span id="phase-badge" class="px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    Belastung
                </span>
                <p id="round-indicator" class="text-slate-400 text-sm font-semibold pt-2">Runde 1 von 2</p>
            </div>

            <!-- Current Exercise Title -->
            <div class="min-h-[4rem] flex flex-col justify-center px-4">
                <h2 id="current-title" class="text-2xl sm:text-3xl font-extrabold text-white leading-tight">Plank</h2>
                <p id="current-subtext" class="text-slate-400 text-xs mt-1"></p>
            </div>

            <!-- Circular Progress / Digital Display -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="50%" cy="50%" r="42%" class="stroke-slate-800" stroke-width="12" fill="transparent" />
                    <circle id="timer-progress" cx="50%" cy="50%" r="42%" class="stroke-emerald-500 transition-all duration-300" stroke-width="12" fill="transparent" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="0" />
                </svg>

                <div class="absolute flex flex-col items-center">
                    <span id="time-display" class="text-6xl sm:text-7xl font-black tracking-tighter text-white">01:00</span>
                    <span id="reps-display" class="text-amber-400 text-sm font-bold mt-1 hidden">40 Wiederholungen</span>
                </div>
            </div>

            <!-- Next Up Preview Banner -->
            <div class="w-full bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-left flex justify-between items-center">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 block">Danach kommt</span>
                    <span id="next-title" class="text-sm font-semibold text-slate-300 truncate max-w-[220px] block">Nächste Übung</span>
                </div>
                <span id="next-duration" class="text-xs font-mono text-slate-400 bg-slate-800 px-2 py-1 rounded">60s</span>
            </div>

            <!-- Workout Controls -->
            <div class="flex items-center gap-4 w-full pt-2">
                <button id="prev-btn" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition active:scale-95">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="pause-btn" class="flex-2 py-4 px-8 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-2xl font-black text-xl shadow-lg transition active:scale-95 flex-grow">
                    <i id="pause-icon" class="fa-solid fa-pause"></i>
                </button>
                <button id="next-btn" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition active:scale-95">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>

            <button id="cancel-workout-btn" class="text-slate-500 hover:text-red-400 text-xs font-semibold uppercase tracking-wider pt-2">
                Workout Abbrechen
            </button>
        </div>

    </main>

    <footer class="p-3 text-center text-xs text-slate-600 border-t border-slate-900">
        Flexibler Intervall- & Athletik-Timer
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const PRESETS = {
            'preset-athletik': {
                rounds: 1,
                rest: 30,
                exercises: [
                    { name: 'Plank + Bein Seitlich ran', duration: 60, reps: '', sets: 2 },
                    { name: 'Seitstütz rechts + Heben senken', duration: 60, reps: '', sets: 2 },
                    { name: 'Seitstütz links + Heben senken', duration: 60, reps: '', sets: 2 },
                    { name: 'Taschenmesser', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: 'Sit Up normal', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: 'Hüfteheben + Bein abwechselnd ausstrecken', duration: 45, reps: '', sets: 2 },
                    { name: 'Liegestütz + Bein diagonal zum Ellenbogen', duration: 45, reps: '', sets: 2 },
                    { name: 'Hüfte heben', duration: 45, reps: '', sets: 2 },
                    { name: 'Russian Twist', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: 'Beine abwechselnd senken / heben', duration: 60, reps: '', sets: 2 },
                    { name: 'Sit up lang', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: '4-Stand + Arm & Knie zusammenziehen', duration: 60, reps: '', sets: 2 },
                    { name: 'Bankstellung', duration: 45, reps: '', sets: 2 },
                    { name: 'Plank + Füße heben', duration: 45, reps: '', sets: 2 }
                ]
            },
            'preset-tabata': {
                rounds: 1,
                rest: 10,
                exercises: [
                    { name: 'High Knees / Sprints', duration: 20, reps: '', sets: 8 },
                    { name: 'Liegestütze', duration: 20, reps: '', sets: 8 },
                    { name: 'Squat Jumps', duration: 20, reps: '', sets: 8 },
                    { name: 'Burpees', duration: 20, reps: '', sets: 8 }
                ]
            }
        };

        let currentWorkout = [];
        let totalRounds = 1;
        let defaultRestTime = 30;
        
        let queue = [];
        let currentQueueIndex = 0;
        let timerInterval = null;
        let timeRemaining = 0;
        let initialPhaseDuration = 0;
        let isPaused = false;
        let soundEnabled = true;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq = 600, type = 'sine', duration = 0.15) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // DOM Elements
        const viewSetup = document.getElementById('view-setup');
        const viewTimer = document.getElementById('view-timer');
        const routineSelect = document.getElementById('routine-select');
        const exportJsonBtn = document.getElementById('export-json-btn');
        const importJsonFile = document.getElementById('import-json-file');
        const documentFileInput = document.getElementById('document-file-input');
        const fileLabel = document.getElementById('file-label');
        const statusMessage = document.getElementById('status-message');
        const defaultRestInput = document.getElementById('default-rest');
        const totalRoundsInput = document.getElementById('total-rounds');
        const exerciseListEl = document.getElementById('exercise-list');
        const addExerciseBtn = document.getElementById('add-exercise-btn');
        const startWorkoutBtn = document.getElementById('start-workout-btn');
        const exerciseCountEl = document.getElementById('exercise-count');

        // Timer View Elements
        const phaseBadge = document.getElementById('phase-badge');
        const roundIndicator = document.getElementById('round-indicator');
        const currentTitle = document.getElementById('current-title');
        const currentSubtext = document.getElementById('current-subtext');
        const timeDisplay = document.getElementById('time-display');
        const repsDisplay = document.getElementById('reps-display');
        const timerProgress = document.getElementById('timer-progress');
        const nextTitle = document.getElementById('next-title');
        const nextDuration = document.getElementById('next-duration');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const cancelBtn = document.getElementById('cancel-workout-btn');
        const toggleSoundBtn = document.getElementById('toggle-sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');

        function loadPreset(key) {
            if (PRESETS[key]) {
                const data = PRESETS[key];
                totalRoundsInput.value = data.rounds;
                defaultRestInput.value = data.rest;
                currentWorkout = JSON.parse(JSON.stringify(data.exercises));
            }
            renderExerciseList();
        }

        function renderExerciseList() {
            exerciseListEl.innerHTML = '';
            currentWorkout.forEach((ex, idx) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col gap-2';
                item.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <input type="text" data-idx="${idx}" data-field="name" value="${ex.name}" placeholder="Übungsname" 
                            class="ex-input font-medium bg-transparent text-slate-100 text-sm focus:outline-none focus:border-b border-indigo-500 flex-1">
                        <button class="delete-ex-btn text-slate-600 hover:text-red-400 p-1 rounded transition" data-idx="${idx}">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 text-xs">
                        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1">
                            <i class="fa-regular fa-clock text-slate-400"></i>
                            <input type="number" data-idx="${idx}" data-field="duration" value="${ex.duration}" min="0" step="5" 
                                class="ex-input w-10 bg-transparent text-right text-emerald-400 font-bold focus:outline-none">
                            <span class="text-[10px] text-slate-500">s</span>
                        </div>
                        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1">
                            <input type="text" data-idx="${idx}" data-field="reps" value="${ex.reps || ''}" placeholder="z.B. 40 Wdh" 
                                class="ex-input w-20 bg-transparent text-center text-amber-400 font-bold focus:outline-none">
                        </div>
                        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1">
                            <span class="text-[10px] text-slate-400">Sätze:</span>
                            <input type="number" data-idx="${idx}" data-field="sets" value="${ex.sets || 1}" min="1" max="20" 
                                class="ex-input w-8 bg-transparent text-center text-indigo-400 font-bold focus:outline-none">
                            <span class="text-[10px] text-slate-400">x</span>
                        </div>
                    </div>
                `;
                exerciseListEl.appendChild(item);
            });

            exerciseCountEl.textContent = `${currentWorkout.length} Übungen`;
            saveCurrentState();

            document.querySelectorAll('.ex-input').forEach(input => {
                const handler = (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    const field = e.target.dataset.field;
                    let val = e.target.value;
                    if (field === 'duration' || field === 'sets') val = parseInt(val) || 0;
                    if (currentWorkout[idx]) {
                        currentWorkout[idx][field] = val;
                    }
                    saveCurrentState();
                };
                input.addEventListener('input', handler);
                input.addEventListener('change', handler);
            });

            document.querySelectorAll('.delete-ex-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.dataset.idx);
                    currentWorkout.splice(idx, 1);
                    renderExerciseList();
                });
            });
        }

        function saveCurrentState() {
            try {
                localStorage.setItem('flexitimer_saved_workout', JSON.stringify({
                    rounds: parseInt(totalRoundsInput.value) || 1,
                    rest: parseInt(defaultRestInput.value) || 30,
                    exercises: currentWorkout
                }));
            } catch (e) {}
        }

        // Export JSON Plan
        exportJsonBtn.addEventListener('click', () => {
            try {
                const workoutData = {
                    title: "Mein Trainingsplan",
                    rounds: parseInt(totalRoundsInput.value) || 1,
                    rest: parseInt(defaultRestInput.value) || 30,
                    exercises: currentWorkout
                };
                const jsonString = JSON.stringify(workoutData, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonString);
                const downloadLink = document.createElement('a');
                downloadLink.setAttribute('href', dataUri);
                downloadLink.setAttribute('download', `trainingsplan_${Date.now()}.json`);
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                showStatus('Plan erfolgreich als JSON heruntergeladen!', 'success');
            } catch (err) {
                showStatus('Export-Fehler: Plan in Zwischenablage kopiert.', 'info');
            }
        });

        // Import JSON Plan
        importJsonFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported && Array.isArray(imported.exercises)) {
                        currentWorkout = imported.exercises;
                        if (imported.rounds) totalRoundsInput.value = imported.rounds;
                        if (imported.rest) defaultRestInput.value = imported.rest;
                        routineSelect.value = 'custom';
                        renderExerciseList();
                        showStatus('JSON Plan erfolgreich geladen!', 'success');
                    }
                } catch (err) {
                    showStatus('Ungültiges JSON Format.', 'error');
                }
            };
            reader.readAsText(file);
        });

        // Generic Parser for Text Line or Table Row
        function parseRowText(rawText) {
            if (!rawText || !rawText.trim()) return null;

            let text = rawText.trim();

            // Ignore header rows often found below Pause definitions (e.g., "WDH/Zeit", "Übung", etc.)
            const isHeaderRow = /^(WDH|Zeit|Übung|Exercise|Reps|Duration|Sets|Sätze)/i.test(text);
            if (isHeaderRow) return null;

            // Check if this row specifies a rest/pause time (e.g. "Pause 30 sek.")
            const pauseMatch = text.match(/^Pause\s*(\d+)\s*(sek|sec|sekunden|s)?/i);
            if (pauseMatch) {
                const restSecs = parseInt(pauseMatch[1]);
                if (!isNaN(restSecs)) {
                    defaultRestInput.value = restSecs;
                }
                return null; // Don't add Pause as a exercise entry
            }

            let duration = 0;
            let reps = '';
            let sets = 1;

            // Check sets multiplier (e.g. 2x, 3x)
            const setsMatch = text.match(/(\d+)\s*x/i);
            if (setsMatch) {
                sets = parseInt(setsMatch[1]) || 1;
                text = text.replace(/(\d+)\s*x/i, '').trim();
            }

            // Check for minutes / seconds
            const minMatch = text.match(/(\d+)\s*(min|minute|minuten)/i);
            const secMatch = text.match(/(\d+)\s*(sek|sec|sekunden|s\b)/i);

            if (minMatch) {
                duration += parseInt(minMatch[1]) * 60;
                text = text.replace(/(\d+)\s*(min|minute|minuten)/i, '').trim();
            }
            if (secMatch) {
                duration += parseInt(secMatch[1]);
                text = text.replace(/(\d+)\s*(sek|sec|sekunden|s\b)/i, '').trim();
            }

            // Check for plain repetitions (e.g., 40 Wdh, 40 Situps)
            const repsMatch = text.match(/(\d+)\s*(wdh|wiederholungen|stk)/i);
            if (repsMatch) {
                reps = `${repsMatch[1]} Wdh`;
                text = text.replace(/(\d+)\s*(wdh|wiederholungen|stk)/i, '').trim();
            } else if (!duration && !minMatch && !secMatch) {
                const leadingNum = text.match(/^(\d+)\b/);
                if (leadingNum) {
                    reps = `${leadingNum[1]} Wdh`;
                    text = text.replace(/^(\d+)\b/, '').trim();
                }
            }

            // Clean exercise name
            let name = text.replace(/^[-–:\.,]\s*/, '').trim();

            if (!name) name = 'Übung';

            return { name, duration, reps, sets };
        }

        // Import Documents (.txt, .xlsx, .csv)
        documentFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.textContent = file.name;
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'txt' || ext === 'csv') {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const lines = event.target.result.split(/\r?\n/);
                    
                    // Suche den Index der ersten "Pause"-Zeile und ignoriere alles davor
                    let firstPauseIndex = lines.findIndex(line => /^Pause\s*\d+/i.test(line.trim()));
                    const validLines = firstPauseIndex !== -1 ? lines.slice(firstPauseIndex) : lines;

                    const parsedList = [];
                    validLines.forEach(line => {
                        const parsed = parseRowText(line);
                        if (parsed && parsed.name) parsedList.push(parsed);
                    });
                    if (parsedList.length > 0) {
                        currentWorkout = parsedList;
                        renderExerciseList();
                        routineSelect.value = 'custom';
                        showStatus(`${parsedList.length} Übungen aus Text-Datei eingelesen!`, 'success');
                    } else {
                        showStatus('Keine Übungen in der Textdatei gefunden.', 'error');
                    }
                };
                reader.readAsText(file);
            } else if (ext === 'xlsx' || ext === 'xls') {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                        // Wandle jede Zeile in Text um
                        const rawLines = jsonData.map(row => (row || []).join(' '));
                        
                        // Suche den Index der ersten "Pause"-Zeile und ignoriere alles davor
                        let firstPauseIndex = rawLines.findIndex(line => /^Pause\s*\d+/i.test(line.trim()));
                        const validLines = firstPauseIndex !== -1 ? rawLines.slice(firstPauseIndex) : rawLines;

                        const parsedList = [];
                        validLines.forEach(lineText => {
                            const parsed = parseRowText(lineText);
                            if (parsed && parsed.name) parsedList.push(parsed);
                        });

                        if (parsedList.length > 0) {
                            currentWorkout = parsedList;
                            renderExerciseList();
                            routineSelect.value = 'custom';
                            showStatus(`${parsedList.length} Übungen aus Excel eingelesen!`, 'success');
                        } else {
                            showStatus('Keine Übungen in der Excel-Tabelle erkannt.', 'error');
                        }
                    } catch (err) {
                        showStatus('Fehler beim Lesen der Excel-Datei.', 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function showStatus(msg, type = 'info') {
            statusMessage.textContent = msg;
            statusMessage.classList.remove('hidden', 'bg-emerald-950/50', 'text-emerald-400', 'bg-red-950/50', 'text-red-400');
            if (type === 'success') {
                statusMessage.classList.add('bg-emerald-950/50', 'text-emerald-400', 'border', 'border-emerald-800');
            } else {
                statusMessage.classList.add('bg-red-950/50', 'text-red-400', 'border', 'border-red-800');
            }
        }

        // Add Exercise
        addExerciseBtn.addEventListener('click', () => {
            currentWorkout.push({ name: 'Neue Übung', duration: 45, reps: '', sets: 1 });
            renderExerciseList();
        });

        routineSelect.addEventListener('change', (e) => {
            loadPreset(e.target.value);
        });

        // Sound Toggle
        toggleSoundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-emerald-400';
                soundText.textContent = 'Ton An';
                playBeep(800, 'sine', 0.1);
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
                soundText.textContent = 'Ton Aus';
            }
        });

        // START WORKOUT
        startWorkoutBtn.addEventListener('click', () => {
            initAudio();
            totalRounds = parseInt(totalRoundsInput.value) || 1;
            defaultRestTime = parseInt(defaultRestInput.value) || 0;

            if (currentWorkout.length === 0) {
                showStatus('Bitte mindestens 1 Übung hinzufügen.', 'error');
                return;
            }

            queue = [];
            for (let r = 1; r <= totalRounds; r++) {
                currentWorkout.forEach((ex, idx) => {
                    const setsCount = ex.sets || 1;
                    
                    for (let s = 1; s <= setsCount; s++) {
                        queue.push({
                            type: 'work',
                            name: ex.name,
                            duration: ex.duration,
                            reps: ex.reps,
                            round: r,
                            totalRounds: totalRounds,
                            set: s,
                            totalSets: setsCount,
                            exIndex: idx + 1,
                            totalEx: currentWorkout.length
                        });

                        let nextName = '';
                        if (s < setsCount) {
                            nextName = `${ex.name} (Satz ${s + 1}/${setsCount})`;
                        } else if (idx < currentWorkout.length - 1) {
                            const nextEx = currentWorkout[idx + 1];
                            nextName = nextEx.sets > 1 ? `${nextEx.name} (1/${nextEx.sets})` : nextEx.name;
                        } else if (r < totalRounds) {
                            const firstEx = currentWorkout[0];
                            nextName = `Runde ${r+1}: ${firstEx.name}`;
                        }

                        const isLastPhase = (r === totalRounds && idx === currentWorkout.length - 1 && s === setsCount);

                        if (defaultRestTime > 0 && !isLastPhase) {
                            queue.push({
                                type: 'rest',
                                name: 'Pause',
                                duration: defaultRestTime,
                                reps: '',
                                nextName: nextName,
                                round: r,
                                totalRounds: totalRounds
                            });
                        }
                    }
                });
            }

            currentQueueIndex = 0;
            viewSetup.classList.add('hidden');
            viewTimer.classList.remove('hidden');
            startPhase();
        });

        function startPhase() {
            clearInterval(timerInterval);
            isPaused = false;
            updatePauseButtonUI();

            const current = queue[currentQueueIndex];
            const next = queue[currentQueueIndex + 1];

            roundIndicator.textContent = current.totalRounds > 1 ? `Zirkel-Runde ${current.round} von ${current.totalRounds}` : 'Workout Aktiv';
            currentTitle.textContent = current.name;

            if (current.type === 'work') {
                const setLabel = current.totalSets > 1 ? ` (Satz ${current.set}/${current.totalSets})` : '';
                phaseBadge.textContent = `Übung ${current.exIndex}/${current.totalEx}${setLabel}`;
                phaseBadge.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                timerProgress.classList.replace('stroke-amber-500', 'stroke-emerald-500');
                
                if (current.reps) {
                    repsDisplay.textContent = current.reps;
                    repsDisplay.classList.remove('hidden');
                } else {
                    repsDisplay.classList.add('hidden');
                }
                currentSubtext.textContent = current.duration > 0 ? '' : 'Führe die Wiederholungen aus';
            } else {
                phaseBadge.textContent = 'Erholung / Pause';
                phaseBadge.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-amber-500/20 text-amber-400 border border-amber-500/30';
                timerProgress.classList.replace('stroke-emerald-500', 'stroke-amber-500');
                repsDisplay.classList.add('hidden');
                currentSubtext.textContent = `Als nächstes: ${current.nextName}`;
            }

            if (next) {
                const nextSetLabel = (next.type === 'work' && next.totalSets > 1) ? ` (Satz ${next.set}/${next.totalSets})` : '';
                nextTitle.textContent = next.type === 'rest' ? 'Pause' : `${next.name}${nextSetLabel}`;
                nextDuration.textContent = next.duration > 0 ? `${next.duration}s` : (next.reps || 'Wdh');
            } else {
                nextTitle.textContent = 'Workout Ende!';
                nextDuration.textContent = '-';
            }

            timeRemaining = current.duration;
            initialPhaseDuration = current.duration;

            if (timeRemaining <= 0) {
                timeDisplay.textContent = "GO!";
                updateProgressRing(1);
                return;
            }

            updateTimeDisplay();
            updateProgressRing(1);
            playBeep(880, 'triangle', 0.25);

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeRemaining--;
                    updateTimeDisplay();
                    updateProgressRing(timeRemaining / initialPhaseDuration);

                    if (timeRemaining <= 3 && timeRemaining > 0) {
                        playBeep(440, 'sine', 0.12);
                    }

                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        nextPhase();
                    }
                }
            }, 1000);
        }

        function nextPhase() {
            if (currentQueueIndex < queue.length - 1) {
                currentQueueIndex++;
                startPhase();
            } else {
                playBeep(523.25, 'sine', 0.2);
                setTimeout(() => playBeep(659.25, 'sine', 0.2), 150);
                setTimeout(() => playBeep(783.99, 'sine', 0.4), 300);
                exitTimer();
            }
        }

        function prevPhase() {
            if (currentQueueIndex > 0) {
                currentQueueIndex--;
                startPhase();
            }
        }

        function updateTimeDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgressRing(fraction) {
            const circumference = 2 * Math.PI * 110; 
            const offset = circumference - (fraction * circumference);
            timerProgress.style.strokeDasharray = `${circumference}`;
            timerProgress.style.strokeDashoffset = offset;
        }

        function updatePauseButtonUI() {
            if (isPaused) {
                pauseIcon.className = 'fa-solid fa-play';
                pauseBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
                pauseBtn.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-400');
            } else {
                pauseIcon.className = 'fa-solid fa-pause';
                pauseBtn.classList.replace('bg-emerald-500', 'bg-amber-500');
                pauseBtn.classList.replace('hover:bg-emerald-400', 'hover:bg-amber-400');
            }
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            updatePauseButtonUI();
        });

        nextBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            nextPhase();
        });

        prevBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            prevPhase();
        });

        function exitTimer() {
            clearInterval(timerInterval);
            viewTimer.classList.add('hidden');
            viewSetup.classList.remove('hidden');
        }

        cancelBtn.addEventListener('click', () => {
            exitTimer();
        });

        function initLoad() {
            try {
                const saved = localStorage.getItem('flexitimer_saved_workout');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.exercises) && parsed.exercises.length > 0) {
                        currentWorkout = parsed.exercises;
                        if (parsed.rounds) totalRoundsInput.value = parsed.rounds;
                        if (parsed.rest) defaultRestInput.value = parsed.rest;
                        routineSelect.value = 'custom';
                        renderExerciseList();
                        return;
                    }
                }
            } catch (e) {}
            loadPreset('preset-athletik');
        }

        initLoad();
    </script>
</body>
</html>
