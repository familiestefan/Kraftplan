
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibler Intervall & Workout Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS CDN für Excel & CSV Upload -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 backdrop-blur">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-stopwatch text-indigo-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">Oles FlexTimer</h1>
        </div>
        <button id="toggle-sound-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm flex items-center gap-2 transition">
            <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-400"></i>
            <span id="sound-text">Ton An</span>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-lg w-full mx-auto p-4 flex flex-col justify-center">

        <!-- VIEW 1: PRESET & WORKOUT BUILDER -->
        <div id="view-setup" class="space-y-6">

            <!-- Presets & File Import -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Trainingsplan auswählen</label>
                <div class="flex gap-2">
                    <select id="routine-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="preset-athletik">Athletik Kreis (Aus Vorlage)</option>
                        <option value="preset-tabata">Klassisches Tabata (4 Min)</option>
                        <option value="custom">-- Eigener Plan / Importiert --</option>
                    </select>
                </div>

                <!-- Text & Excel File Import Section -->
                <div class="mt-4 pt-3 border-t border-slate-800">
                    <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">
                        <i class="fa-solid fa-file-arrow-up mr-1"></i> Datei einlesen (.txt, .xlsx, .xls, .csv)
                    </label>
                    <label class="flex items-center justify-center w-full p-3 bg-slate-950 border border-dashed border-indigo-800/80 hover:border-indigo-500 rounded-xl cursor-pointer transition text-xs text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-file-lines mr-2 text-indigo-400 text-sm"></i>
                        <span id="file-label">Datei auswählen (.txt, .xlsx, .csv)</span>
                        <input type="file" id="document-file-input" accept=".txt, .xlsx, .xls, .csv" class="hidden">
                    </label>
                    <div id="status-message" class="hidden mt-2 p-2.5 rounded-xl text-xs text-center font-medium"></div>
                </div>

                <!-- Export & Import Buttons for JSON Plans -->
                <div class="mt-4 pt-3 border-t border-slate-800 flex gap-2">
                    <button id="export-json-btn" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-download text-indigo-400"></i> Plan Exportieren (JSON)
                    </button>
                    <label class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5 cursor-pointer text-center">
                        <i class="fa-solid fa-upload text-indigo-400"></i> Plan Importieren
                        <input type="file" id="import-json-file" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Global Settings (Default Pause & Rounds) -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Workout Einstellungen</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Standard Pause (Sek)</label>
                        <input type="number" id="default-rest" value="30" min="0" max="300" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-amber-400 font-bold focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Zirkel-Runden gesamt</label>
                        <input type="number" id="total-rounds" value="1" min="1" max="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-indigo-400 font-bold focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Exercises List -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Übungen im Zirkel</h2>
                    <span id="exercise-count" class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full">0 Übungen</span>
                </div>

                <div id="exercise-list" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                    <!-- Dynamic exercise cards generated here -->
                </div>

                <button id="add-exercise-btn" class="w-full py-2.5 border-2 border-dashed border-slate-700 hover:border-slate-500 text-slate-400 hover:text-slate-200 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Übung hinzufügen
                </button>
            </div>

            <!-- Start Button -->
            <button id="start-workout-btn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-lg rounded-2xl shadow-lg shadow-emerald-950/50 uppercase tracking-wider transition transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Workout Starten
            </button>
        </div>

        <!-- VIEW 2: ACTIVE TIMER RUNNING -->
        <div id="view-timer" class="hidden flex flex-col items-center justify-center text-center space-y-6">

            <!-- Round & Status Header -->
            <div class="space-y-1">
                <span id="phase-badge" class="px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    Belastung
                </span>
                <p id="round-indicator" class="text-slate-400 text-sm font-semibold pt-2">Runde 1 von 2</p>
            </div>

            <!-- Current Exercise Title -->
            <div class="min-h-[4rem] flex flex-col justify-center px-4">
                <h2 id="current-title" class="text-2xl sm:text-3xl font-extrabold text-white leading-tight">Plank</h2>
                <p id="current-subtext" class="text-slate-400 text-xs mt-1"></p>
            </div>

            <!-- Circular Progress / Digital Display -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="50%" cy="50%" r="42%" class="stroke-slate-800" stroke-width="12" fill="transparent" />
                    <circle id="timer-progress" cx="50%" cy="50%" r="42%" class="stroke-emerald-500 transition-all duration-300" stroke-width="12" fill="transparent" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="0" />
                </svg>

                <div class="absolute flex flex-col items-center">
                    <span id="time-display" class="text-6xl sm:text-7xl font-black tracking-tighter text-white">01:00</span>
                    <span id="reps-display" class="text-amber-400 text-sm font-bold mt-1 hidden">40 Wiederholungen</span>
                </div>
            </div>

            <!-- Next Up Preview Banner -->
            <div class="w-full bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-left flex justify-between items-center">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 block">Danach kommt</span>
                    <span id="next-title" class="text-sm font-semibold text-slate-300 truncate max-w-[220px] block">Nächste Übung</span>
                </div>
                <span id="next-duration" class="text-xs font-mono text-slate-400 bg-slate-800 px-2 py-1 rounded">60s</span>
            </div>

            <!-- Workout Controls -->
            <div class="flex items-center gap-4 w-full pt-2">
                <button id="prev-btn" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition active:scale-95">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="pause-btn" class="flex-2 py-4 px-8 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-2xl font-black text-xl shadow-lg transition active:scale-95 flex-grow">
                    <i id="pause-icon" class="fa-solid fa-pause"></i>
                </button>
                <button id="next-btn" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition active:scale-95">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>

            <button id="cancel-workout-btn" class="text-slate-500 hover:text-red-400 text-xs font-semibold uppercase tracking-wider pt-2">
                Workout Abbrechen
            </button>
        </div>

    </main>

    <footer class="p-3 text-center text-xs text-slate-600 border-t border-slate-900">
        Flexibler Intervall- & Athletik-Timer
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const PRESETS = {
            'preset-athletik': {
                rounds: 1,
                rest: 30,
                exercises: [
                    { name: 'Plank + Bein Seitlich ran', duration: 60, reps: '', sets: 2 },
                    { name: 'Seitstütz rechts + Heben senken', duration: 60, reps: '', sets: 2 },
                    { name: 'Seitstütz links + Heben senken', duration: 60, reps: '', sets: 2 },
                    { name: 'Taschenmesser', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: 'Sit Up normal', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: 'Hüfteheben + Bein abwechselnd ausstrecken', duration: 45, reps: '', sets: 2 },
                    { name: 'Liegestütz + Bein diagonal zum Ellenbogen', duration: 45, reps: '', sets: 2 },
                    { name: 'Hüfte heben', duration: 45, reps: '', sets: 2 },
                    { name: 'Russian Twist', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: 'Beine abwechselnd senken / heben', duration: 60, reps: '', sets: 2 },
                    { name: 'Sit up lang', duration: 0, reps: '40 Wdh', sets: 1 },
                    { name: '4-Stand + Arm & Knie zusammenziehen', duration: 60, reps: '', sets: 2 },
                    { name: 'Bankstellung', duration: 45, reps: '', sets: 2 },
                    { name: 'Plank + Füße heben', duration: 45, reps: '', sets: 2 }
                ]
            },
            'preset-tabata': {
                rounds: 1,
                rest: 10,
                exercises: [
                    { name: 'High Knees / Sprints', duration: 20, reps: '', sets: 8 },
                    { name: 'Liegestütze', duration: 20, reps: '', sets: 8 },
                    { name: 'Squat Jumps', duration: 20, reps: '', sets: 8 },
                    { name: 'Burpees', duration: 20, reps: '', sets: 8 }
                ]
            }
        };

        let currentWorkout = [];
        let totalRounds = 1;
        let defaultRestTime = 30;
        
        let queue = [];
        let currentQueueIndex = 0;
        let timerInterval = null;
        let timeRemaining = 0;
        let initialPhaseDuration = 0;
        let isPaused = false;
        let soundEnabled = true;
        let announcedHalfway = false;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sprachausgabe für "Halbzeit"
        function speakHalfway() {
            if (!soundEnabled) return;
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Vorherige Sprache abbrechen
                    const utterance = new SpeechSynthesisUtterance('Halbzeit');
                    utterance.lang = 'de-DE';
                    utterance.rate = 1.0;
                    utterance.volume = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {}
        }

        // Neue flexiblere und lautere Beep-Funktion
        function playBeep(freq = 600, type = 'square', duration = 0.15, volume = 0.9) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Square/Triangle Welle ist drastisch lauter & prägnanter als Sine
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                // Viel höhere Lautstärke (0.9 max)
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // DOM Elements
        const routineSelect = document.getElementById('routine-select');
        const defaultRestInput = document.getElementById('default-rest');
        const totalRoundsInput = document.getElementById('total-rounds');
        const exerciseList = document.getElementById('exercise-list');
        const exerciseCount = document.getElementById('exercise-count');
        const addExerciseBtn = document.getElementById('add-exercise-btn');
        const startWorkoutBtn = document.getElementById('start-workout-btn');
        const documentFileInput = document.getElementById('document-file-input');
        const fileLabel = document.getElementById('file-label');
        const statusMessage = document.getElementById('status-message');
        const exportJsonBtn = document.getElementById('export-json-btn');
        const importJsonFile = document.getElementById('import-json-file');

        const viewSetup = document.getElementById('view-setup');
        const viewTimer = document.getElementById('view-timer');

        const toggleSoundBtn = document.getElementById('toggle-sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');

        const phaseBadge = document.getElementById('phase-badge');
        const roundIndicator = document.getElementById('round-indicator');
        const currentTitle = document.getElementById('current-title');
        const currentSubtext = document.getElementById('current-subtext');
        const timeDisplay = document.getElementById('time-display');
        const repsDisplay = document.getElementById('reps-display');
        const nextTitle = document.getElementById('next-title');
        const nextDuration = document.getElementById('next-duration');
        const timerProgress = document.getElementById('timer-progress');

        const prevBtn = document.getElementById('prev-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const nextBtn = document.getElementById('next-btn');
        const cancelWorkoutBtn = document.getElementById('cancel-workout-btn');

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            loadPreset('preset-athletik');
        });

        routineSelect.addEventListener('change', (e) => {
            if (e.target.value in PRESETS) {
                loadPreset(e.target.value);
            }
        });

        function loadPreset(key) {
            const preset = PRESETS[key];
            if (!preset) return;
            
            defaultRestTime = preset.rest;
            totalRounds = preset.rounds;
            
            defaultRestInput.value = defaultRestTime;
            totalRoundsInput.value = totalRounds;

            currentWorkout = JSON.parse(JSON.stringify(preset.exercises));
            renderExercises();
        }

        defaultRestInput.addEventListener('change', (e) => {
            defaultRestTime = parseInt(e.target.value) || 30;
        });

        totalRoundsInput.addEventListener('change', (e) => {
            totalRounds = parseInt(e.target.value) || 1;
        });

        function showStatus(msg, isError = false) {
            statusMessage.textContent = msg;
            statusMessage.className = `mt-2 p-2.5 rounded-xl text-xs text-center font-medium ${isError ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}`;
            statusMessage.classList.remove('hidden');
        }

        function renderExercises() {
            exerciseList.innerHTML = '';
            exerciseCount.textContent = `${currentWorkout.length} Übungen`;

            currentWorkout.forEach((ex, index) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-950 border border-slate-800 p-3 rounded-xl flex flex-col gap-2 relative group hover:border-slate-700 transition';

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-bold text-slate-500 w-5">#${index + 1}</span>
                        <input type="text" value="${ex.name}" data-index="${index}" data-field="name" class="ex-input bg-transparent font-semibold text-sm text-slate-100 focus:outline-none focus:border-b border-indigo-500 flex-1 truncate" placeholder="Übungsname">
                        <button data-index="${index}" class="delete-btn text-slate-600 hover:text-red-400 p-1 rounded transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-xs pt-1 border-t border-slate-900">
                        <div>
                            <label class="text-[10px] text-slate-500 block">Dauer (Sek)</label>
                            <input type="number" value="${ex.duration}" min="0" data-index="${index}" data-field="duration" class="ex-input w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-emerald-400 font-mono font-bold focus:outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 block">Wdh (Text)</label>
                            <input type="text" value="${ex.reps || ''}" data-index="${index}" data-field="reps" class="ex-input w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-amber-400 font-mono font-bold focus:outline-none" placeholder="z.B. 40 Wdh">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 block">Sätze (x)</label>
                            <input type="number" value="${ex.sets || 1}" min="1" max="10" data-index="${index}" data-field="sets" class="ex-input w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-indigo-400 font-mono font-bold focus:outline-none">
                        </div>
                    </div>
                `;

                exerciseList.appendChild(card);
            });

            // Input handlers
            document.querySelectorAll('.ex-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.index;
                    const field = e.target.dataset.field;
                    if (field === 'duration' || field === 'sets') {
                        currentWorkout[idx][field] = parseInt(e.target.value) || 0;
                    } else {
                        currentWorkout[idx][field] = e.target.value;
                    }
                });
            });

            // Delete handlers
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.currentTarget.dataset.index;
                    currentWorkout.splice(idx, 1);
                    renderExercises();
                });
            });
        }

        addExerciseBtn.addEventListener('click', () => {
            currentWorkout.push({
                name: 'Neue Übung',
                duration: 45,
                reps: '',
                sets: 1
            });
            renderExercises();
        });

        // JSON EXPORT & IMPORT
        exportJsonBtn.addEventListener('click', () => {
            if (currentWorkout.length === 0) {
                showStatus('Keine Übungen zum Exportieren vorhanden!', true);
                return;
            }

            const exportData = {
                rest: parseInt(defaultRestInput.value) || 30,
                rounds: parseInt(totalRoundsInput.value) || 1,
                exercises: currentWorkout
            };

            const jsonStr = JSON.stringify(exportData, null, 2);
            
            try {
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Trainingsplan_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('Plan erfolgreich als JSON exportiert!');
            } catch (err) {
                navigator.clipboard.writeText(jsonStr);
                showStatus('Download blockiert - Plan wurde in Zwischenablage kopiert!');
            }
        });

        importJsonFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported.exercises && Array.isArray(imported.exercises)) {
                        currentWorkout = imported.exercises;
                        if (imported.rest !== undefined) defaultRestInput.value = imported.rest;
                        if (imported.rounds !== undefined) totalRoundsInput.value = imported.rounds;
                        defaultRestTime = parseInt(defaultRestInput.value) || 30;
                        totalRounds = parseInt(totalRoundsInput.value) || 1;
                        
                        routineSelect.value = 'custom';
                        renderExercises();
                        showStatus('JSON-Plan erfolgreich geladen!');
                    } else {
                        showStatus('Ungültiges JSON-Format!', true);
                    }
                } catch (err) {
                    showStatus('Fehler beim Lesen der JSON-Datei!', true);
                }
            };
            reader.readAsText(file);
        });

        // PARSER FÜR TXT, CSV UND EXCEL DATEIEN
        documentFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileLabel.textContent = file.name;
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'txt' || ext === 'csv') {
                const reader = new FileReader();
                reader.onload = (event) => parseTextOrCsvContent(event.target.result);
                reader.readAsText(file);
            } else if (ext === 'xlsx' || ext === 'xls') {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const csvContent = XLSX.utils.sheet_to_csv(worksheet);
                        parseTextOrCsvContent(csvContent);
                    } catch (err) {
                        showStatus("Fehler beim Einlesen der Excel-Datei", true);
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function parseTextOrCsvContent(content) {
            const rawLines = content.split(/\r?\n/);
            
            // 1. Suche nach der ERSTEN Zeile, die mit "Pause" beginnt
            let pauseLineIndex = -1;
            for (let i = 0; i < rawLines.length; i++) {
                if (rawLines[i].trim().toLowerCase().startsWith('pause')) {
                    pauseLineIndex = i;
                    break;
                }
            }

            let linesToProcess = [];
            if (pauseLineIndex !== -1) {
                // Pausenzeit extrahieren (z. B. "Pause 30 sek.")
                const pauseMatch = rawLines[pauseLineIndex].match(/(\d+)/);
                if (pauseMatch) {
                    defaultRestTime = parseInt(pauseMatch[1]);
                    defaultRestInput.value = defaultRestTime;
                }
                // Alles VOR der ersten Pause ignorieren
                linesToProcess = rawLines.slice(pauseLineIndex + 1);
            } else {
                linesToProcess = rawLines;
            }

            const parsedExercises = [];

            linesToProcess.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const lower = trimmed.toLowerCase();

                // 2. Tabellenköpfe & Spaltenüberschriften überspringen
                if (lower.includes('wdh') && lower.includes('übung')) return;
                if (lower.includes('zeit') && lower.includes('übung')) return;
                if (lower.startsWith('wdh/zeit') || lower.startsWith('übung')) return;

                let duration = 0;
                let reps = '';
                let sets = 1;
                let name = trimmed;

                const parts = trimmed.split(/,|\t|;/).map(p => p.trim()).filter(Boolean);

                if (parts.length >= 2) {
                    const firstCol = parts[0];
                    const secondCol = parts[1];

                    if (/^\d+\s*wdh/i.test(firstCol) || /^\d+$/ .test(firstCol)) {
                        reps = firstCol;
                        name = secondCol;
                    } else if (firstCol.includes('min') || firstCol.includes('sek') || firstCol.includes('s')) {
                        const parsedDuration = parseTimeString(firstCol);
                        duration = parsedDuration.duration;
                        sets = parsedDuration.sets;
                        name = secondCol;
                    } else {
                        name = firstCol;
                        const parsedDuration = parseTimeString(secondCol);
                        duration = parsedDuration.duration;
                        sets = parsedDuration.sets;
                        if (duration === 0) reps = secondCol;
                    }
                } else {
                    const minMatch = trimmed.match(/(\d+)\s*min/i);
                    const sekMatch = trimmed.match(/(\d+)\s*sek/i);
                    const repsMatch = trimmed.match(/(\d+)\s*wdh/i);
                    const setsMatch = trimmed.match(/(\d+)x/i);

                    if (minMatch) duration += parseInt(minMatch[1]) * 60;
                    if (sekMatch) duration += parseInt(sekMatch[1]);
                    if (repsMatch) reps = `${repsMatch[1]} Wdh`;
                    if (setsMatch) sets = parseInt(setsMatch[1]);

                    name = trimmed
                        .replace(/\d+\s*min/gi, '')
                        .replace(/\d+\s*sek/gi, '')
                        .replace(/\d+\s*wdh/gi, '')
                        .replace(/\d+x/gi, '')
                        .trim();
                }

                if (name.length > 0) {
                    parsedExercises.push({
                        name: name.replace(/^[,\t;-]+|[,\t;-]+$/g, '').trim(),
                        duration: duration,
                        reps: reps,
                        sets: sets || 1
                    });
                }
            });

            if (parsedExercises.length > 0) {
                currentWorkout = parsedExercises;
                routineSelect.value = 'custom';
                renderExercises();
                showStatus(`${parsedExercises.length} Übungen erfolgreich geladen!`);
            } else {
                showStatus("Keine passenden Übungen gefunden.", true);
            }
        }

        function parseTimeString(str) {
            let duration = 0;
            let sets = 1;

            const setsMatch = str.match(/(\d+)x/i);
            if (setsMatch) sets = parseInt(setsMatch[1]);

            const minMatch = str.match(/(\d+)\s*min/i);
            const sekMatch = str.match(/(\d+)\s*sek/i);

            if (minMatch) duration += parseInt(minMatch[1]) * 60;
            if (sekMatch) duration += parseInt(sekMatch[1]);

            return { duration, sets };
        }

        // START WORKOUT
        startWorkoutBtn.addEventListener('click', () => {
            if (currentWorkout.length === 0) {
                showStatus('Bitte füge mindestens eine Übung hinzu!', true);
                return;
            }

            initAudio();

            // Queue aufbauen (Belastung + Pause)
            queue = [];
            for (let r = 1; r <= totalRounds; r++) {
                currentWorkout.forEach((ex, exIndex) => {
                    const totalSets = ex.sets || 1;
                    for (let s = 1; s <= totalSets; s++) {
                        // Belastungsphase
                        queue.push({
                            type: 'work',
                            title: ex.name,
                            subtext: totalSets > 1 ? `Satz ${s} von ${totalSets}` : '',
                            duration: ex.duration,
                            reps: ex.reps,
                            round: r,
                            totalRounds: totalRounds,
                            exIndex: exIndex + 1,
                            totalEx: currentWorkout.length
                        });

                        // Pausenphase (ausser nach dem allerletzten Satz der allerletzten Runde)
                        const isLastInWorkout = (r === totalRounds) && (exIndex === currentWorkout.length - 1) && (s === totalSets);
                        if (!isLastInWorkout && defaultRestTime > 0) {
                            queue.push({
                                type: 'rest',
                                title: 'Pause',
                                subtext: `Nächste Übung: ${s < totalSets ? ex.name : (currentWorkout[exIndex + 1]?.name || 'Nächste Runde')}`,
                                duration: defaultRestTime,
                                reps: '',
                                round: r,
                                totalRounds: totalRounds,
                                exIndex: exIndex + 1,
                                totalEx: currentWorkout.length
                            });
                        }
                    }
                });
            }

            currentQueueIndex = 0;
            isPaused = false;
            viewSetup.classList.add('hidden');
            viewTimer.classList.remove('hidden');

            startPhase();
        });

        function startPhase() {
            if (timerInterval) clearInterval(timerInterval);

            const item = queue[currentQueueIndex];
            timeRemaining = item.duration;
            initialPhaseDuration = item.duration;
            announcedHalfway = false;

            // UI Update
            roundIndicator.textContent = `Runde ${item.round} von ${item.totalRounds} • Übung ${item.exIndex}/${item.totalEx}`;
            currentTitle.textContent = item.title;
            currentSubtext.textContent = item.subtext;

            if (item.type === 'work') {
                phaseBadge.textContent = 'Belastung';
                phaseBadge.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                timerProgress.classList.remove('stroke-amber-500');
                timerProgress.classList.add('stroke-emerald-500');
            } else {
                phaseBadge.textContent = 'Pause';
                phaseBadge.className = 'px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-amber-500/20 text-amber-400 border border-amber-500/30';
                timerProgress.classList.remove('stroke-emerald-500');
                timerProgress.classList.add('stroke-amber-500');
            }

            // Reps display
            if (item.reps) {
                repsDisplay.textContent = item.reps;
                repsDisplay.classList.remove('hidden');
            } else {
                repsDisplay.classList.add('hidden');
            }

            // Next Up Banner
            if (currentQueueIndex < queue.length - 1) {
                const nextItem = queue[currentQueueIndex + 1];
                nextTitle.textContent = `${nextItem.type === 'rest' ? 'Pause' : nextItem.title}`;
                nextDuration.textContent = nextItem.duration > 0 ? `${nextItem.duration}s` : nextItem.reps || '0s';
            } else {
                nextTitle.textContent = 'Workout Ende!';
                nextDuration.textContent = '0s';
            }

            if (timeRemaining <= 0) {
                timeDisplay.textContent = "GO!";
                updateProgressRing(1);
                return;
            }

            updateTimeDisplay();
            updateProgressRing(1);
            // Startsignal beim Phasenbeginn
            playBeep(784, 'triangle', 0.2, 0.8);

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeRemaining--;
                    updateTimeDisplay();
                    updateProgressRing(timeRemaining / initialPhaseDuration);

                    // Halbzeit-Ansage: Sagt exakt bei der Hälfte der jeweiligen Übungsdauer "Halbzeit"
                    if (initialPhaseDuration >= 10 && !announcedHalfway) {
                        const halfwayTime = Math.floor(initialPhaseDuration / 2);
                        if (timeRemaining === halfwayTime) {
                            announcedHalfway = true;
                            speakHalfway();
                        }
                    }

                    // Signal-Logik:
                    // 10 Sekunden vor Ende: Einzelner Beep zur Vorwarnung
                    if (timeRemaining === 10) {
                        playBeep(523.25, 'triangle', 0.15, 0.8); // C5
                    } 
                    // Countdown bei 5, 4, 3, 2, 1
                    else if (timeRemaining <= 5 && timeRemaining > 0) {
                        playBeep(659.25, 'square', 0.12, 0.9); // E5 (heller & prägnant)
                    }

                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        // Ton bei Null: Länger & andere Frequenz (G5 high pitch)
                        playBeep(1046.5, 'square', 0.45, 1.0); // C6 hoch & laut
                        setTimeout(() => {
                            nextPhase();
                        }, 200);
                    }
                }
            }, 1000);
        }

        function nextPhase() {
            if (currentQueueIndex < queue.length - 1) {
                currentQueueIndex++;
                startPhase();
            } else {
                // Workout fertig Fanfare
                playBeep(523.25, 'square', 0.2, 0.9);
                setTimeout(() => playBeep(659.25, 'square', 0.2, 0.9), 150);
                setTimeout(() => playBeep(783.99, 'square', 0.2, 0.9), 300);
                setTimeout(() => playBeep(1046.5, 'square', 0.5, 1.0), 450);
                exitTimer();
            }
        }

        function prevPhase() {
            if (currentQueueIndex > 0) {
                currentQueueIndex--;
                startPhase();
            }
        }

        function exitTimer() {
            if (timerInterval) clearInterval(timerInterval);
            viewTimer.classList.add('hidden');
            viewSetup.classList.remove('hidden');
        }

        function updateTimeDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgressRing(fraction) {
            const circle = timerProgress;
            const radius = circle.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (fraction * circumference);
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = offset;
        }

        // CONTROLS
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                pauseIcon.className = 'fa-solid fa-play';
                pauseBtn.classList.replace('bg-amber-500', 'bg-emerald-500');
                pauseBtn.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-400');
            } else {
                pauseIcon.className = 'fa-solid fa-pause';
                pauseBtn.classList.replace('bg-emerald-500', 'bg-amber-500');
                pauseBtn.classList.replace('hover:bg-emerald-400', 'hover:bg-amber-400');
            }
        });

        nextBtn.addEventListener('click', () => {
            nextPhase();
        });

        prevBtn.addEventListener('click', () => {
            prevPhase();
        });

        cancelWorkoutBtn.addEventListener('click', () => {
            exitTimer();
        });

        toggleSoundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-emerald-400';
                soundText.textContent = 'Ton An';
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-red-400';
                soundText.textContent = 'Stumm';
            }
        });
    </script>
</body>
